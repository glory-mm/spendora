<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page - spendora</title>

    <link rel="stylesheet" href="css/register.css">
    
</head>
<body>
    
    <form action="">

        <legend>Join us and start your journey today!!</legend>
        <br>

        <label for="Fullname">Fullname:</label>
        <input type="text" placeholder="e.g John Doe" id ="Fullname" name="Fullname" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" placeholder="e.g john@example.com" id ="email" name="email" required>
        <br><br>

        <label for="pwd">Password:</label>
        <input type="password" placeholder="Enter your password" id ="pwd" name="pwd" required>
        <br><br>

        <label for="yob">Birthday:</label>
        <input type="date" id="yob" name="yob" required>
        <br><br>

        <label for="dt">Date and time :</label>
        <input type="datetime-local" id="dt" name="dt" required>
        <br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>

        <label for="phone">phone Number:</label>
        <input type="tel" placeholder="e.g +1234567890" id="phone" name="phone" required>
        <br><br>

        <label for="country">Country:</label>
        <select id="country" name="country" required>
            <option value="">Select your country</option>
            <option value="USA">USA</option>
            <option value="Canada">Canada</option>
            <option value="UK">UK</option>
            <option value="Australia">Australia</option>
            <option value="India">India</option>
        </select>
        <br><br>

        <label for="bio">Bio:</label>
        <textarea id="bio" name="bio" rows="4" cols="50" placeholder="Tell us about yourself..." required></textarea>
        <br><br>
        

        <label for="file">Upload file:</label>
        <input type="file" id="file" name="file" required>
        <br><br>

        <!---DropDown-->


        <!---Radio buttons-->



        <!---Checkboxes-->
        <label for="interests">Interests:</label>
        <input type="checkbox" id="sports" name="interests" value="sports">
        <label for="sports">Sports</label>
        <input type="checkbox" id="music" name="interests" value="music">
        <label for="music">Music</label>
        <input type="checkbox" id="travel" name="interests" value="travel">
        <label for="travel">Travel</label>
        <input type="checkbox" id="reading" name="interests" value="reading">
        <label for="reading">Reading</label>
        <br><br>
        
        <!---Textarea-->
        

        <button>Register</button>

    </form>






</body>
</html>
